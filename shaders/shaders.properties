iris.features.required = SSBO CUSTOM_IMAGES SEPARATE_HARDWARE_SAMPLERS

allowConcurrentCompute=false
separateAo=true
shadow.culling=true
particles.ordering = before
sky=false
moon=false
sun=false
stars=false
clouds=off


uniform.vec2.resolution = vec2(viewWidth,viewHeight)
uniform.vec2.resolutionInv = vec2(1.0/viewWidth, 1.0/viewHeight)
uniform.vec3.cameraVector =  previousCameraPosition - cameraPosition
uniform.float.eyeBrightnessSky   = smooth(eyeBrightness.y / 240.0, 5.0, 5.0)

bufferObject.0 = 1024

bufferObject.1 = 32
bufferObject.2 = 1 true 1.0 1.0 
bufferObject.3 = 1 true 1.0 1.0 
bufferObject.4 = 4096 
bufferObject.5 = 1 true 1.0 1.0 
bufferObject.6 = 8192

customTexture.cloudcoveragetex = /textures/cloudcoverage.png 
customTexture.cloudshapetex = /textures/cloudshape.bin TEXTURE_3D RGBA8 128 128 128 RGBA UNSIGNED_BYTE
customTexture.clouddetailtex = /textures/clouddetail.bin TEXTURE_3D RGB8 32 32 32 RGB UNSIGNED_BYTE
customTexture.vanillacloudtex = minecraft:textures/environment/clouds.png
customTexture.bluenoisetex = /textures/stbn.bin TEXTURE_3D RGBA8 128 128 16 RGBA UNSIGNED_BYTE
customTexture.moontex = /textures/moon.png

image.gpbColor0 =   gpbColor0t RGB R11F_G11F_B10F FLOAT false true 1.0 1.0
image.gpbColor1 =   gpbColor1t RGB R11F_G11F_B10F FLOAT false true 1.0 1.0
image.gpbColor2 =   gpbColor2t RGB R11F_G11F_B10F FLOAT false true 1.0 1.0
image.gpbUint0 =    gpbUint0t RED_INTEGER R32UI UNSIGNED_INT false true 1.0 1.0
image.hiZimg =      hiZtex RED R32F FLOAT false true 1.0 1.0
image.denoiserCh0 = denoiserCh0t RGBA RGBA16F HALF_FLOAT false true 1.0 1.0
image.denoiserCh1 = denoiserCh1t RGBA RGBA16F HALF_FLOAT false true 1.0 1.0
image.denoiserES =  denoiserESt RGBA RGBA8_SNORM BYTE false true 1.0 1.0


image.skyLUTimg = skyLUTtex rgba rgba8 float false false 128 128
image.skyimg = skytex rgb r11f_g11f_b10f float false false 128 512
image.dgbu2img = dgbu2tex rg RG16 float false true 1.0 1.0

size.buffer.colortex8 = 1.0 2.0

# SETTINGS SCREEN #

screen.columns = 1
screen.postProcessing.columns = 1

sliders = LM_INTENSITY EXPOSURE SHADOW_QUALITY SHADOW_DISTANCE BLOOM_INTENSITY EMISSION_MULTIPLIER

screen.postProcessing = AA EXPOSURE BLOOM_INTENSITY TONEMAP_OPERATOR

screen = [postProcessing] <empty> HIZ_PIXEL_SIZE RAY_PENETRATION DENOISER LM_INTENSITY <empty> SHADOW_QUALITY SHADOW_DISTANCE <empty> REMOVE_FOG VANILLA_CLOUDS CLOUD_SHADOWS EMISSION_MULTIPLIER 



#if DENOISER == 0
    program.world0/deferred40.enabled = false
    program.world1/deferred40.enabled = false
    program.world-1/deferred40.enabled = false
#endif
#

# vvv BLENDING vvv #

blend.gbuffers_weather.colortex0 = ZERO SRC_COLOR ONE ONE

blend.gbuffers_water.colortex0 = ZERO SRC_COLOR ONE ZERO
blend.gbuffers_water.colortex1 = off
blend.gbuffers_hand_water= ZERO SRC_COLOR ONE ZERO
blend.gbuffers_line = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE
blend.gbuffers_spidereyes=off
blend.gbuffers_block=off

#blend.gbuffers_textured.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured=off
blend.gbuffers_entities=off
blend.gbuffers_hand=off
blend.gbuffers_terrain_solid=off


blend.gbuffers_entities_translucent.colortex1=off
blend.gbuffers_entities_translucent.colortex2=off
blend.gbuffers_entities_translucent.colortex3=off


blend.composite87 = ONE ONE ZERO ZERO
blend.composite88 = ONE ONE ZERO ZERO
blend.composite89 = ONE ONE ZERO ZERO
blend.composite90 = ONE ONE ZERO ZERO
blend.composite91 = ONE ONE ZERO ZERO
blend.composite92 = ONE ONE ZERO ZERO

